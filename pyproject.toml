[project]
name = "hok-decision-ai"
version = "0.1.0"
description = "王者荣耀对局决策建议系统：数据爬取、结构化与确定性模拟环境"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hok-data = "hok_decision.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
